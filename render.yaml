services:
  # ─── BACKEND WEB SERVICE ────────────────────────────────
  - type: web
    name: onereal-lms-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true # Render will generate a cryptographically secure random key
      - key: MAINTENANCE_PASSWORD
        generateValue: true # Render will generate a maintenance password for you
      - key: GOOGLE_AI_KEY
        sync: false # You will be prompted to enter this in the Render dashboard
      - key: FRONTEND_URL
        fromService:
          type: static
          name: onereal-lms-frontend
          property: url

  # ─── FRONTEND STATIC SITE ──────────────────────────────
  - type: static
    name: onereal-lms-frontend
    env: static
    buildCommand: npm run build
    publishDir: dist
    routes:
      - source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: onereal-lms-backend
          property: url
