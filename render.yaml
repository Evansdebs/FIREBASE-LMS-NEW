services:
  # ─── BACKEND WEB SERVICE ────────────────────────────────
  - type: web
    name: onereal-lms-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && node scripts/prepare-db-prod.js && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: onereal-lms-db
          property: connectionString
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true # Render will generate a cryptographically secure random key
      - key: MAINTENANCE_PASSWORD
        generateValue: true # Render will generate a maintenance password for you
      - key: GOOGLE_AI_KEY
        sync: false # You will be prompted to enter this in the Render dashboard
      - key: FRONTEND_URL
        fromService:
          type: web
          name: onereal-lms-frontend
          property: host

  # ─── FRONTEND STATIC SITE ──────────────────────────────
  - type: web
    name: onereal-lms-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - source: /*
        destination: /index.html
        type: rewrite
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: onereal-lms-backend
          property: host

databases:
  - name: onereal-lms-db
    plan: free
    databaseName: onereal_lms
    user: onereal_admin
